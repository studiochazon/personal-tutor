<svg width="400" height="200" viewBox="0 0 400 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EFF6FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DBEAFE;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1D4ED8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="200" fill="url(#bgGradient)"/>
  
  <!-- Decorative circles -->
  <circle cx="50" cy="50" r="20" fill="#BFDBFE" opacity="0.6"/>
  <circle cx="350" cy="30" r="15" fill="#93C5FD" opacity="0.4"/>
  <circle cx="320" cy="170" r="25" fill="#60A5FA" opacity="0.3"/>
  
  <!-- Main icon - Graduation cap -->
  <g transform="translate(200, 100)">
    <!-- Cap base -->
    <ellipse cx="0" cy="0" rx="35" ry="8" fill="url(#iconGradient)"/>
    
    <!-- Cap top -->
    <path d="M-35 0 L-25 -15 L25 -15 L35 0 Z" fill="url(#iconGradient)"/>
    
    <!-- Cap tassel -->
    <rect x="-2" y="-15" width="4" height="25" fill="#1E40AF"/>
    <circle cx="0" cy="10" r="3" fill="#1E40AF"/>
    
    <!-- Book -->
    <rect x="-20" y="5" width="40" height="25" rx="2" fill="white" stroke="#3B82F6" stroke-width="2"/>
    <rect x="-15" y="10" width="30" height="2" fill="#6B7280"/>
    <rect x="-15" y="15" width="25" height="2" fill="#6B7280"/>
    <rect x="-15" y="20" width="20" height="2" fill="#6B7280"/>
  </g>
  
  <!-- Text -->
  <text x="200" y="180" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="500" fill="#374151">
    Course Thumbnail
  </text>
</svg>
